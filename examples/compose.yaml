services:
  renewer:
    image: ghcr.io/kiefer413/vcf-cert-renewer:1.5.0
    env_file: ./container.env
    command: ["scheduler"]
    restart: unless-stopped
    stop_grace_period: 20m
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    volumes:
      - renewer-data:/data
    secrets:
      - vcf_api_token
      - sddc_password
      - dns_tsig_secret
secrets:
  vcf_api_token:
    file: ./secrets/vcf_api_token
  sddc_password:
    file: ./secrets/sddc_password
  dns_tsig_secret:
    file: ./secrets/dns_tsig_secret
volumes:
  renewer-data:
