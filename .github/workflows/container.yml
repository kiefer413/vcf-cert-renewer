name: Container
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build native runtime and offline test image
        run: |
          docker build --build-arg TARGETARCH=${{ matrix.arch }} -t vcf-cert-renewer:1.3.1 .
          docker build -t vcf-cert-renewer-test:1.3.1 - < packaging/Dockerfile.test
      - name: Offline release validation
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,size=256m -v "$PWD:/work:ro" vcf-cert-renewer-test:1.3.1
          python3 scripts/container_smoke.py vcf-cert-renewer:1.3.1
          python3 scripts/check_container_layers.py vcf-cert-renewer:1.3.1
          python3 scripts/check_build_context.py
          if [ -f scripts/check_public_markers.py ]; then python3 scripts/check_public_markers.py; fi
          git diff --check
          git fsck --full
  publish:
    if: github.repository == 'kiefer413/vcf-cert-renewer' && startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-24.04
    environment: ghcr-release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate stable release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PYCODE'
          import os, re
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag), 'Stable version tag required'
          namespace = {}
          exec(Path('vcf_cert_renewer/__init__.py').read_text(), namespace)
          assert tag == 'v' + namespace['__version__'], 'Tag/application version mismatch'
          PYCODE
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/kiefer413/vcf-cert-renewer
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
