name: Container
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build native runtime and offline test image
        run: |
          docker build --build-arg TARGETARCH=${{ matrix.arch }} -t vcf-cert-renewer:1.5.1 .
          docker build -t vcf-cert-renewer-test:1.5.1 - < packaging/Dockerfile.test
      - name: Validate Compose configuration
        run: |
          docker compose version
          cp examples/container.env.example examples/container.env
          mkdir -p examples/secrets
          for name in vcf_api_token sddc_password dns_tsig_secret; do
            printf '%s\n' 'dummy-ci-value' > "examples/secrets/$name"
          done
          docker compose -f examples/compose.yaml config --quiet
          rm -f examples/container.env examples/secrets/{vcf_api_token,sddc_password,dns_tsig_secret}
      - name: Offline release validation
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,size=256m -v "$PWD:/work:ro" vcf-cert-renewer-test:1.5.1
          python3 scripts/container_smoke.py vcf-cert-renewer:1.5.1
          python3 scripts/container_scheduler_smoke.py vcf-cert-renewer:1.5.1
          python3 scripts/check_container_layers.py vcf-cert-renewer:1.5.1
          python3 scripts/check_build_context.py
          if [ -f scripts/check_public_markers.py ]; then python3 scripts/check_public_markers.py; fi
          git diff --check
          git fsck --full
  publish:
    if: github.repository == 'kiefer413/vcf-cert-renewer' && startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-24.04
    environment: ghcr-release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate stable release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PYCODE'
          import os, re
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag), 'Stable version tag required'
          namespace = {}
          exec(Path('vcf_cert_renewer/__init__.py').read_text(), namespace)
          assert tag == 'v' + namespace['__version__'], 'Tag/application version mismatch'
          PYCODE
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/kiefer413/vcf-cert-renewer
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
