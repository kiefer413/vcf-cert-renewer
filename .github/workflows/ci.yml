name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m compileall -q vcf_cert_renewer scripts tests
      - run: sudo unshare --net -- sh -ec 'ip link set lo up; exec "$@"' sh "$(command -v python)" -m pytest -q
      - run: python -m scripts.smoke_test
      - run: python scripts/check_public_markers.py
