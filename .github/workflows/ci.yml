name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m compileall -q vcf_cert_renewer scripts tests
      - run: python -m pytest -q
      - run: python -m scripts.smoke_test
      - run: python scripts/check_public_markers.py
