name: Bug report
description: Report a reproducible defect using sanitized data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include credentials, private keys, customer names, or private infrastructure details.
  - type: input
    id: version
    attributes:
      label: Version
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Sanitized reproduction steps
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Read-only checks and logs
      description: Include only sanitized output.
