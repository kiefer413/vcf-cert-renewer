# Optional drop-in: /etc/systemd/system/vcf-cert-renewer.service.d/credentials.conf
# Requires systemd >= 247. Keep ordinary configuration in EnvironmentFile.
[Service]
LoadCredential=vcf_api_token:/etc/vcf-cert-renewer/credentials/vcf_api_token
LoadCredential=sddc_password:/etc/vcf-cert-renewer/credentials/sddc_password
LoadCredential=dns_tsig_secret:/etc/vcf-cert-renewer/credentials/dns_tsig_secret
Environment=VCF_API_TOKEN_FILE=%d/vcf_api_token
Environment=SDDC_PASSWORD_FILE=%d/sddc_password
Environment=DNSUPDATE_TSIG_SECRET_FILE=%d/dns_tsig_secret
# Optional EAB (also configure ACME_EAB_KID):
# LoadCredential=acme_eab_hmac:/etc/vcf-cert-renewer/credentials/acme_eab_hmac
# Environment=ACME_EAB_HMAC_FILE=%d/acme_eab_hmac
